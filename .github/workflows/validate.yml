name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_skill.py
      - run: python -m unittest discover -s skills/handheld-development/tests -v
      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find skills/handheld-development/scripts -type f -name '*.sh' -print0)
      - name: Check Linux controller helpers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only skills/handheld-development/scripts/joystick_map_probe.c
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only skills/handheld-development/scripts/semantic_input.c
          gcc -std=c11 -Wall -Wextra -Werror -fsyntax-only $(pkg-config --cflags sdl2) skills/handheld-development/scripts/sdl_controller_probe.c
